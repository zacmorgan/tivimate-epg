name: Update IPTV guide

on:
  push:
    branches: [main]
    paths:
      - update_epg.py
      - .github/workflows/update-guide.yml
  schedule:
    - cron: "23 16 * * *" # Daily at 16:23 UTC.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv-guide
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download, merge, and validate every country guide
        run: >-
          python update_epg.py
          --output dist/all-guides.xml.gz
          --work-dir "${RUNNER_TEMP}/epg-work"
          --cache-hours 0
          --workers 2

      - name: Upload a complete draft, then publish it as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="guide-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_title="IPTV guide $(date -u +%Y-%m-%d)"
          printf 'All country guides from https://iptv-epg.org/guides, merged and validated.\n\nGenerated at %s. See all-guides-report.json for source and programme counts.\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "$release_tag" --draft --title "$release_title" --notes-file "${RUNNER_TEMP}/release-notes.md"
          gh release upload "$release_tag" dist/all-guides.xml.gz dist/all-guides-report.json
          gh release edit "$release_tag" --draft=false --latest
          printf 'EPG URL: https://github.com/%s/releases/latest/download/all-guides.xml.gz\n' "$GH_REPO" >> "$GITHUB_STEP_SUMMARY"
