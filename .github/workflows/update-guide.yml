name: Update custom TiviMate EPG

on:
  push:
    branches: [main]
    paths:
      - custom-channels.json
      - update_custom_epg.py
      - .github/workflows/update-guide.yml
  schedule:
    - cron: "23 16 * * 0" # Every Sunday at 16:23 UTC.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-custom-tivimate-epg
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the guide repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download, filter, and validate the custom guide
        run: >-
          python update_custom_epg.py
          --output all-channels-epg.xml.gz
          --work-dir "${RUNNER_TEMP}/epg-work"

      - name: Commit the refreshed guide when listings changed
        run: |
          set -euo pipefail
          if git diff --quiet -- all-channels-epg.xml.gz; then
            echo "The generated guide is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all-channels-epg.xml.gz
          git commit -m "Refresh weekly custom EPG [skip ci]"
          git push
